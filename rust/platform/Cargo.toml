[package]
name = "driftwave-platform"
description = "Driftwave's system integration: Now Playing and media keys, notifications, single instance, menu bar / tray icon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "driftwave_platform"

[dependencies]
# Now Playing / media keys on all three platforms (MPNowPlayingInfoCenter, SMTC, MPRIS).
souvlaki = "0.9"
# The menu bar (macOS) / notification-area (Windows) / StatusNotifier (Linux) icon and its menu.
tray-icon = "0.26"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSBundle", "NSError"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger"] }
block2 = "0.6"
# The theme's scene as layers under the UI (layers.rs).
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "CALayer", "CATransaction"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

# Windows: the single-instance named pipe.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes"] }
# The app id, its Start-menu shortcut and notifications (winapp.rs). The same version souvlaki uses for the media
# overlay, so nothing new is fetched.
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_EnhancedStorage", "Data_Xml_Dom", "UI_Notifications"] }

[dev-dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
