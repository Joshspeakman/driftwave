[package]
name = "driftwave-app"
description = "Driftwave: internet radio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "driftwave"
path = "src/main.rs"

[dependencies]
driftwave-core = { path = "../core" }
driftwave-audio = { path = "../audio" }
driftwave-vis = { path = "../vis" }
driftwave-platform = { path = "../platform" }
serde_json.workspace = true
ureq.workspace = true
uuid.workspace = true
url.workspace = true
# Native file dialogs (import, export, a station's cover) and the locale's country (Discover).
rfd = "0.15"
sys-locale = "0.3"
# Station covers: the formats station logos come in (no SVG); decoded small.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "ico", "webp", "bmp"] }
# Local time for the LCD clock.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Royalty-free licence: About says "Made with Slint" (docs/RUST-SCOPE.md).
# Only the software renderer (measured lighter for this window than the GPU one) and the winit backend.
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "accessibility", "backend-winit", "renderer-software", "unstable-winit-030"] }

# The process's own CPU time: a moving scene steps back to still if it costs too much on this computer.
[target.'cfg(target_os = "macos")'.dependencies]
# The allocator: macOS's own keeps freed large blocks (a backdrop's window-sized scratch pictures) dirty in
# a reclaim cache, about 100 MB more footprint with a scene theme on a Retina screen; mimalloc returns them.
mimalloc = { version = "0.1", default-features = false }
# The patched softbuffer (vendor/), for its see-through switch under the scene layers.
softbuffer = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Globalization"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
slint-build = "1.19"
