[workspace]
resolver = "2"
members = ["core", "audio", "vis", "app", "platform"]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Josh Speakman"]
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
url = "2"
unicode-segmentation = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

# The visualizers do per-pixel work every frame: optimise them even in debug builds and tests.
[profile.dev.package.driftwave-vis]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3

# softbuffer 0.4.8 with one change for the Mac: frames tagged sRGB instead of device RGB, so macOS
# doesn't colour-match each one on the CPU. See vendor/softbuffer/src/backends/cg.rs ("Driftwave").
[patch.crates-io]
softbuffer = { path = "vendor/softbuffer" }
