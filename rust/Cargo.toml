[workspace]
resolver = "2"
members = ["core"]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Josh Speakman"]
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["json"] }
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
